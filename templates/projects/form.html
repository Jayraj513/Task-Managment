{% extends 'base.html' %}

{% block title %}{{ action_title }} — Workline{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
  <div class="flex items-center gap-3">
    <a href="{% if project %}{% url 'project_detail' project_id=project.id %}{% else %}{% url 'project_list' %}{% endif %}" class="text-slate-400 hover:text-slate-600 text-sm">
      &larr; Back
    </a>
    <h1 class="text-xl font-bold text-slate-900 tracking-tight">{{ action_title }}</h1>
  </div>

  <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <!-- Name & Key -->
      <div class="grid grid-cols-3 gap-4">
        <div class="col-span-2">
          <label class="block text-xs font-semibold text-slate-700 mb-1">Project Name <span class="text-rose-500">*</span></label>
          <input type="text" name="name" value="{{ project.name|default:'' }}" required placeholder="e.g. Mobile App Redesign" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Key (Prefix) <span class="text-rose-500">*</span></label>
          <input type="text" name="key" value="{{ project.key|default:'' }}" {% if project %}disabled{% endif %} required placeholder="MAR" maxlength="10" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none uppercase font-mono {% if project %}bg-slate-50 text-slate-500{% endif %}">
        </div>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Description</label>
        <textarea name="description" rows="3" placeholder="Provide context, goals, and success metrics for this project..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">{{ project.description|default:'' }}</textarea>
      </div>

      <!-- Owner & Status -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Project Owner</label>
          <select name="owner" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
            <option value="">Select owner...</option>
            {% for u in users %}
              <option value="{{ u.id }}" {% if project.owner_id == u.id or not project and user.id == u.id %}selected{% endif %}>
                {{ u.get_full_name|default:u.username }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Status</label>
          <select name="status" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
            {% for sval, slabel in status_choices %}
              <option value="{{ sval }}" {% if project.status == sval or not project and sval == 'ACTIVE' %}selected{% endif %}>{{ slabel }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Timeline & Color -->
      <div class="grid grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Start Date</label>
          <input type="date" name="start_date" value="{{ project.start_date|date:'Y-m-d'|default:'' }}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Due Date</label>
          <input type="date" name="due_date" value="{{ project.due_date|date:'Y-m-d'|default:'' }}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Theme Color</label>
          <input type="color" name="color" value="{{ project.color|default:'#4f46e5' }}" class="h-10 w-full p-1 rounded-lg border border-slate-300 cursor-pointer">
        </div>
      </div>

      <!-- Actions -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
        <a href="{% if project %}{% url 'project_detail' project_id=project.id %}{% else %}{% url 'project_list' %}{% endif %}" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-lg text-xs font-semibold">
          Cancel
        </a>
        <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors">
          Save Project
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
