<!-- Quick Create Task Modal -->
<div id="quick-create-modal" class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-md bg-indigo-600 text-white flex items-center justify-center text-xs font-bold">+</div>
        <h3 class="text-sm font-bold text-slate-800">Quick Create Task</h3>
      </div>
      <button type="button" onclick="closeModal('quick-create-modal')" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
    </div>

    <form action="{% url 'task_quick_create' %}" method="POST" class="p-6 space-y-4">
      {% csrf_token %}
      <!-- Task Title -->
      <div>
        <label for="qc-title" class="block text-xs font-semibold text-slate-700 mb-1">Task Title <span class="text-rose-500">*</span></label>
        <input
          type="text"
          id="qc-title"
          name="title"
          required
          placeholder="What needs to be done?"
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        >
      </div>

      <!-- Project Selection -->
      <div>
        <label for="qc-project" class="block text-xs font-semibold text-slate-700 mb-1">Project <span class="text-rose-500">*</span></label>
        <select
          id="qc-project"
          name="project"
          required
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white"
        >
          <option value="">Select project...</option>
          {% for p in active_projects %}
            <option value="{{ p.id }}">{{ p.name }} ({{ p.key }})</option>
          {% endfor %}
        </select>
      </div>

      <!-- Grid: Priority & Due Date -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="qc-priority" class="block text-xs font-semibold text-slate-700 mb-1">Priority</label>
          <select
            id="qc-priority"
            name="priority"
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white"
          >
            <option value="URGENT">Urgent</option>
            <option value="HIGH">High</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="LOW">Low</option>
          </select>
        </div>

        <div>
          <label for="qc-due-date" class="block text-xs font-semibold text-slate-700 mb-1">Due Date</label>
          <input
            type="date"
            id="qc-due-date"
            name="due_date"
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          >
        </div>
      </div>

      <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
        <span class="text-[11px] text-slate-400">Esc to cancel</span>
        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="closeModal('quick-create-modal')"
            class="px-3 py-1.5 border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-lg text-xs font-semibold"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm"
          >
            Create Task
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
