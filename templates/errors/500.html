{% extends 'base.html' %}

{% block title %}Internal Server Error (500) — Workline{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center p-6 text-center">

    <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto text-xl font-bold">
      500
